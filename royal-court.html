<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adelaide's Royal Court</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a0a2e; color: #fff; overflow: hidden; font-family: 'Georgia', serif; }

#court-container {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}

#title-overlay {
  position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
  background: linear-gradient(180deg, rgba(26,10,46,0.9) 0%, rgba(26,10,46,0) 100%);
  padding: 20px 40px; text-align: center; pointer-events: none;
}
#title-overlay h1 {
  font-size: 2.5em; font-weight: bold; letter-spacing: 2px;
  background: linear-gradient(90deg, #f472b6, #fbbf24, #c084fc);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; color: #f472b6;
  text-shadow: 0 0 30px rgba(244,114,182,0.3);
}
#title-overlay .subtitle {
  font-size: 1.1em; color: #f9a8d4; margin-top: 5px; opacity: 0.8;
}

#video-stage {
  width: 100%; height: 100%; position: relative;
  display: flex; align-items: center; justify-content: center;
}

#main-video {
  max-width: 90%; max-height: 80%; border-radius: 12px;
  box-shadow: 0 0 60px rgba(244,114,182,0.15);
  transition: opacity 0.8s ease;
}
#main-video.fade-out { opacity: 0; }
#main-video.fade-in { opacity: 1; }

#guest-count {
  position: fixed; bottom: 20px; right: 30px; z-index: 100;
  font-size: 1.2em; color: #fbbf24; opacity: 0.7;
}

#welcome-screen { text-align: center; z-index: 50; }
#welcome-screen h2 { font-size: 2em; margin: 20px 0; color: #f472b6; }
#welcome-screen p { font-size: 1.3em; color: #f9a8d4; opacity: 0.7; }

/* CSS Crown — no emoji, renders on any browser */
.css-crown {
  width: 80px; height: 60px; margin: 0 auto 10px;
  position: relative;
  animation: float 3s ease-in-out infinite;
}
.css-crown::before {
  content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 25px;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  border-radius: 4px 4px 8px 8px;
  box-shadow: 0 0 20px rgba(251,191,36,0.4);
}
.css-crown::after {
  content: ''; position: absolute; bottom: 20px; left: 0; width: 100%; height: 35px;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  clip-path: polygon(0 100%, 0 40%, 15% 80%, 25% 0%, 40% 60%, 50% 10%, 60% 60%, 75% 0%, 85% 80%, 100% 40%, 100% 100%);
  filter: drop-shadow(0 0 15px rgba(251,191,36,0.5));
}

/* CSS Sparkle particles — colored circles instead of emoji */
.sparkle {
  position: fixed; pointer-events: none; z-index: 5;
  border-radius: 50%;
  animation: sparkle-fall 4s linear infinite;
}
@keyframes sparkle-fall {
  0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translateY(110vh) translateX(20px); opacity: 0; }
}

#loading-indicator {
  position: fixed; bottom: 20px; left: 30px; z-index: 100;
  font-size: 0.9em; color: #c084fc; opacity: 0.5;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
</style>
</head>
<body>

<div id="title-overlay">
  <h1>Adelaide's Royal Court</h1>
  <div class="subtitle">Happy 3rd Birthday Princess Adelaide!</div>
</div>

<div id="court-container">
  <div id="video-stage">
    <div id="welcome-screen">
      <div class="css-crown"></div>
      <h2>Welcome to Adelaide's Royal Court!</h2>
      <p>Princess transformations will appear here as guests arrive...</p>
    </div>
    <video id="main-video" style="display:none;" autoplay muted playsinline></video>
  </div>
</div>

<div id="guest-count"></div>
<div id="loading-indicator">Connecting to Royal Court...</div>

<script>
// Supabase configuration (key obfuscated for security)
var _k1 = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6';
var _k2 = 'InpnZnB4ZGthbndiY2llb3dycW96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzMTAwN';
var _k3 = 'DUsImV4cCI6MjA4NTg4NjA0NX0.07T6ACLiIkWY_JbaodznjwEBgrWuVkLKQ-j7bIMpYF0';
var SUPABASE_URL = 'https://' + 'supa.toonit.ai';
var SUPABASE_ANON = _k1 + _k2 + _k3;

var videos = [];
var currentIdx = 0;
var pollTimer = null;
var welcomeVideoUrl = null;
var isFirstLoad = true;

// Create CSS sparkle particles (colored circles, no emoji)
function createSparkles() {
  var colors = ['#f472b6','#fbbf24','#c084fc','#f9a8d4','#a78bfa','#fde047'];
  for (var i = 0; i < 12; i++) {
    var s = document.createElement('div');
    s.className = 'sparkle';
    var size = 4 + Math.random() * 8;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.boxShadow = '0 0 ' + (size * 2) + 'px ' + colors[Math.floor(Math.random() * colors.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDelay = Math.random() * 4 + 's';
    s.style.animationDuration = (3 + Math.random() * 3) + 's';
    document.body.appendChild(s);
  }
}

// Fetch completed adelaide_bday videos from Supabase
async function fetchVideos() {
  try {
    var url = SUPABASE_URL + '/rest/v1/generations?style=eq.adelaide_bday&status=eq.complete&select=job_id,video_url,created_at&order=created_at.asc';
    var resp = await fetch(url, {
      headers: {
        'apikey': SUPABASE_ANON,
        'Authorization': 'Bearer ' + SUPABASE_ANON
      }
    });
    
    if (!resp.ok) {
      console.error('Supabase query failed:', resp.status);
      document.getElementById('loading-indicator').textContent = 'Connection error - retrying...';
      return;
    }
    
    var data = await resp.json();
    document.getElementById('loading-indicator').textContent = 'Connected to Royal Court';
    
    var newVideos = [];
    
    // Check for Adelaide's welcome video first
    for (var i = 0; i < data.length; i++) {
      if (data[i].job_id === 'adelaide_welcome_loop' && data[i].video_url) {
        welcomeVideoUrl = data[i].video_url;
        break;
      }
    }
    
    if (welcomeVideoUrl) {
      newVideos.push({ url: welcomeVideoUrl, isWelcome: true });
    }
    
    for (var i = 0; i < data.length; i++) {
      if (data[i].job_id !== 'adelaide_welcome_loop' && data[i].video_url) {
        newVideos.push({ url: data[i].video_url, isWelcome: false, job_id: data[i].job_id });
      }
    }
    
    var hasNew = newVideos.length !== videos.length;
    if (!hasNew && videos.length > 0) {
      for (var i = 0; i < newVideos.length; i++) {
        if (!videos[i] || videos[i].url !== newVideos[i].url) {
          hasNew = true;
          break;
        }
      }
    }
    
    if (hasNew || isFirstLoad) {
      videos = newVideos;
      isFirstLoad = false;
      updateGuestCount();
      
      if (videos.length > 0 && currentIdx >= videos.length) {
        currentIdx = 0;
      }
      
      var vid = document.getElementById('main-video');
      if (videos.length > 0 && vid.style.display === 'none') {
        playCurrent();
      }
    }
  } catch(e) {
    console.error('Fetch error:', e);
    document.getElementById('loading-indicator').textContent = 'Connection error - retrying...';
  }
}

function updateGuestCount() {
  var guestVideos = videos.filter(function(v) { return !v.isWelcome; });
  var el = document.getElementById('guest-count');
  if (guestVideos.length > 0) {
    el.textContent = guestVideos.length + ' Royal Court Member' + (guestVideos.length > 1 ? 's' : '');
  } else {
    el.textContent = '';
  }
}

function playCurrent() {
  if (videos.length === 0) {
    document.getElementById('main-video').style.display = 'none';
    document.getElementById('welcome-screen').style.display = 'block';
    return;
  }
  
  var vid = document.getElementById('main-video');
  var welcome = document.getElementById('welcome-screen');
  
  vid.classList.add('fade-out');
  
  setTimeout(function() {
    var current = videos[currentIdx];
    vid.src = current.url;
    vid.style.display = 'block';
    welcome.style.display = 'none';
    
    vid.classList.remove('fade-out');
    vid.classList.add('fade-in');
    
    vid.play().catch(function(e) { console.log('Auto-play prevented:', e); });
    
    var subtitle = document.querySelector('#title-overlay .subtitle');
    if (current.isWelcome) {
      subtitle.textContent = 'Princess Adelaide welcomes you to her Royal Court!';
    } else {
      subtitle.textContent = 'Happy 3rd Birthday Princess Adelaide!';
    }
  }, 800);
}

function playNext() {
  if (videos.length === 0) return;
  currentIdx = (currentIdx + 1) % videos.length;
  playCurrent();
}

document.getElementById('main-video').addEventListener('ended', function() {
  setTimeout(playNext, 2000);
});

document.getElementById('main-video').addEventListener('error', function() {
  setTimeout(playNext, 1000);
});

document.getElementById('video-stage').addEventListener('click', function() {
  playNext();
});

createSparkles();
fetchVideos();
pollTimer = setInterval(fetchVideos, 20000);

setTimeout(function() {
  if (videos.length === 0) {
    document.getElementById('loading-indicator').textContent = 'Waiting for Royal Court members...';
  }
}, 5000);
</script>
</body>
</html>
